<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5d4c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="출석부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>우리 학원 출석부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Do+Hyeon&family=Gaegu&display=swap">
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: 출석부(attendance book) — paper ground, green cover-cloth header, red holidays / blue Saturdays like a Korean wall calendar. Bottom tab bar, one column on phone, two on tablet. */
:root{
  --bg:#f3f5f1; --paper:#ffffff; --ink:#1d2622; --muted:#66736d; --line:#dfe5df;
  --cover:#1f5d4c; --cover-ink:#f4f8f5; --accent:#1f5d4c; --accent-soft:#e2eee8;
  --sun:#c8372d; --sat:#2a5db0; --hol-soft:#fbe9e6;
  --ok:#23824f; --ok-soft:#dff2e6; --late:#b7790f; --late-soft:#fbf0d6; --no:#c8372d; --no-soft:#fbe5e2;
  --mk:#5b4fc4; --mk-soft:#ebe8fb;
  --c0:#1f7a5c; --c1:#2a5db0; --c2:#b5531f; --c3:#8a3fa8; --c4:#b7790f; --c5:#c03a6b; --c6:#3f7f99; --c7:#5d6b1f;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --paper:#1a221e; --ink:#e6ece8; --muted:#97a59e; --line:#2c3732;
  --cover:#173f34; --cover-ink:#e8f2ec; --accent:#6cc4a1; --accent-soft:#1f3a30;
  --sun:#f07a6f; --sat:#7fa8ef; --hol-soft:#3a2220;
  --ok:#5fcf8f; --ok-soft:#1d3a2a; --late:#e8b14c; --late-soft:#3a3018; --no:#f07a6f; --no-soft:#3d2220;
  --mk:#a99ff2; --mk-soft:#2a2645;
  --c0:#5fc49e; --c1:#7fa8ef; --c2:#ec9a6a; --c3:#cf93e6; --c4:#e8b14c; --c5:#f08bb0; --c6:#7fc2dc; --c7:#b8c766;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --paper:#1a221e; --ink:#e6ece8; --muted:#97a59e; --line:#2c3732;
  --cover:#173f34; --cover-ink:#e8f2ec; --accent:#6cc4a1; --accent-soft:#1f3a30;
  --sun:#f07a6f; --sat:#7fa8ef; --hol-soft:#3a2220;
  --ok:#5fcf8f; --ok-soft:#1d3a2a; --late:#e8b14c; --late-soft:#3a3018; --no:#f07a6f; --no-soft:#3d2220;
  --mk:#a99ff2; --mk-soft:#2a2645;
  --c0:#5fc49e; --c1:#7fa8ef; --c2:#ec9a6a; --c3:#cf93e6; --c4:#e8b14c; --c5:#f08bb0; --c6:#7fc2dc; --c7:#b8c766;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cover);color:var(--cover-ink);padding:10px 16px 12px}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;margin-right:auto}
.sync{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block;opacity:.6}
.sync.on i{background:#8fe0b5;opacity:1}
main{max-width:980px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{border:0;background:none;padding:6px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs button[aria-current="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--no);border-color:var(--no-soft)}
.btn.icon{width:40px;justify-content:center;padding:0;font-size:18px}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.datebar h2 small{font-family:var(--f-body);font-size:14px;color:var(--muted);margin-left:6px}
.wd-0{color:var(--sun)} .wd-6{color:var(--sat)}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner.hol{background:var(--hol-soft);color:var(--sun)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.summary{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.late{background:var(--late-soft);color:var(--late)} .pill.no{background:var(--no-soft);color:var(--no)} .pill.mk{background:var(--mk-soft);color:var(--mk)} .pill.hol{background:var(--hol-soft);color:var(--sun)}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
.pane{container-type:inline-size;min-width:0}
@container (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);display:grid;gap:10px;min-width:0}
.card.off{opacity:.6;box-shadow:none}
.chead{display:flex;align-items:flex-start;gap:10px}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;min-width:52px}
.who{min-width:0;flex:1}
.who b{font-size:17px;font-weight:600;display:block;overflow-wrap:anywhere}
.who span{font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;margin-top:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:44px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on.ok{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.seg button.on.late{background:var(--late);border-color:var(--late);color:var(--paper)}
.seg button.on.out{background:var(--sat);border-color:var(--sat);color:var(--paper)}
.seg button small{display:block;font-size:11px;font-weight:500;line-height:1.1;opacity:.9}
.pill.out{background:var(--accent-soft);color:var(--sat)}
.prow{display:grid;grid-template-columns:minmax(0,90px) 1fr 40px;gap:8px;align-items:center}
.seg button.on.no{background:var(--no);border-color:var(--no);color:var(--paper)}
.empty{text-align:center;color:var(--muted);padding:32px 16px;background:var(--paper);border:1px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* calendar */
.cal{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-h div{text-align:center;font-size:12px;font-weight:600;padding:6px 0;color:var(--muted);border-bottom:1px solid var(--line)}
.cal-h div:first-child{color:var(--sun)} .cal-h div:last-child{color:var(--sat)}
.cell{min-height:74px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:none;text-align:left;padding:4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.out{opacity:.35}
.cell.today .dn{background:var(--accent);color:var(--paper);border-radius:999px;padding:0 6px}
.cell.sel{background:var(--accent-soft)}
.dn{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;align-self:flex-start}
.cell.hol .dn{color:var(--sun)}
.hn{font-size:10px;color:var(--sun);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ev{font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;border-radius:4px;padding:0 3px;background:var(--bg)}
.ev.mk{background:var(--mk-soft);color:var(--mk)}
.ev.done{text-decoration:line-through;opacity:.7}
.more{font-size:10px;color:var(--muted)}
@container (min-width:560px){.cell{min-height:104px;padding:6px}.ev{font-size:12px}}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.mode button{border:0;background:none;padding:0 14px;min-height:38px;font-size:14px;font-weight:500;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
.wk{display:grid;gap:8px}
.wday{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wday.hol{background:var(--hol-soft)}
.wday.sel{border-color:var(--accent)}
.whead{width:100%;border:0;background:none;display:flex;align-items:baseline;gap:8px;padding:10px 12px 6px;text-align:left}
.whead b{font-size:20px;font-variant-numeric:tabular-nums}
.whead span{font-size:13px}
.wday.today .whead b{color:var(--accent)}
.wcount{color:var(--muted)}
.witems{display:grid;gap:4px;padding:0 8px 10px}
.witem{display:flex;align-items:center;gap:8px;border:0;background:var(--bg);border-radius:9px;padding:7px 9px;text-align:left;width:100%;min-width:0;font-size:14px}
.wt{font-variant-numeric:tabular-nums;font-weight:600;min-width:44px}
.wn{flex:1;min-width:0;overflow-wrap:anywhere}
.wn small{color:var(--muted);margin-left:6px;font-size:12px}
.wnone{font-size:13px;color:var(--muted);padding:2px 4px}
@container (min-width:640px){
  .wk{grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .wday{min-height:320px}
  .whead{flex-wrap:wrap;gap:2px 6px;padding:8px 8px 6px}
  .whead .spacer{display:none}
  .wk .witems{padding:0 5px 8px}
  .wk .witem{flex-wrap:wrap;gap:2px 6px;padding:6px;font-size:13px}
  .wk .wt{min-width:0}
  .wk .wn{flex-basis:100%;order:3}
  .wk .wn small{display:block;margin-left:0}
  .wk .witem .dot{display:none}
}
.mklist{padding:0;gap:6px}
.mkrow{background:var(--paper);border:1px solid var(--line);padding:10px 12px;flex-wrap:wrap}
.mkd{font-weight:600;font-variant-numeric:tabular-nums;min-width:66px}
/* tablet: 출석 체크 always on the left, the chosen tab on the right */
.split{display:grid;grid-template-columns:clamp(330px,36%,440px) minmax(0,1fr);gap:20px;align-items:start}
.pane-day{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,56px) + 12px);max-height:calc(100vh - var(--hdr,56px) - var(--tabh,64px) - 24px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 14px 16px}
.pane-day .card{box-shadow:none;background:var(--bg)}
.pane-day .seg button{background:var(--paper)}
.pane-day .datebar h2{font-size:21px}
@media (min-width:760px){
  main{max-width:1440px;padding-inline:20px}
  .top-in{max-width:1400px}
  .tabs{grid-template-columns:repeat(3,minmax(0,160px));justify-content:center}
  .tabs button[data-tab="day"]{display:none}
}
.login{max-width:420px;margin:24px auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:12px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
/* students */
.group{margin:18px 0 8px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.slist{display:grid;gap:8px}
@container (min-width:640px){.slist{grid-template-columns:1fr 1fr}}
.srow{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;min-width:0}
.srow .who b{font-size:16px}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:18px;max-height:86%}}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px;width:100%;min-height:44px;color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.slot{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:center}
.days{display:flex;gap:6px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.sched{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.sch{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--bg);font-size:14px;border:0;text-align:left;width:100%}
.sch.skip{background:none;color:var(--muted);text-decoration:line-through}
.sch .n{font-weight:700;color:var(--muted);font-size:13px}
.confirm{background:var(--no-soft);border-radius:12px;padding:12px;display:grid;gap:8px;color:var(--no);font-size:14px}
.hlist{display:grid;gap:4px}
.hrow{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-size:14px}
.hrow .d{font-variant-numeric:tabular-nums;font-weight:600;min-width:92px}
.hrow.off-no{opacity:.55}
.sec{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:14px}
.sec h3{margin:0;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.kiosk{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));text-align:center}
.kiosk h1{margin:0;font-size:clamp(24px,4vw,36px)}
.kiosk .clock{color:var(--muted);font-size:18px}
.kdots{display:flex;gap:14px;justify-content:center;min-height:28px}
.kdots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent)}
.kdots i.on{background:var(--accent)}
.kpad{display:grid;grid-template-columns:repeat(3,minmax(72px,110px));gap:12px}
.kpad button{min-height:clamp(64px,10vh,96px);border-radius:18px;border:1px solid var(--line);background:var(--paper);font-size:clamp(26px,4vw,36px);font-weight:600;color:var(--ink)}
.kpad button:active{background:var(--accent-soft)}
.kmsg{font-size:18px;min-height:28px}
.kmsg.err{color:var(--no)}
.kwho{display:grid;gap:14px;width:min(520px,100%)}
.kcard{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;display:grid;gap:12px}
.kcard b{font-size:clamp(24px,4vw,32px)}
.kbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kbtns button{min-height:84px;border-radius:16px;border:0;font-size:26px;font-weight:700;color:var(--paper)}
.kbtns .in{background:var(--ok)} .kbtns .out{background:var(--sat)}
.kbtns button:disabled{opacity:.35}
.kexit{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border:0;background:none;color:var(--muted);font-size:13px;padding:10px}
.kdone{font-size:clamp(28px,5vw,44px);font-weight:700;color:var(--ok)}
</style>
</head>
<body>


<header class="top"><div class="top-in"><div class="brand">우리 학원 출석부</div><div class="sync" id="sync"><i></i><span>불러오는 중</span></div></div></header>
<main id="app"></main>
<div id="kioskRoot"></div>
<nav class="tabs" id="tabs">
  <button data-tab="day"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>출석</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>달력</button>
  <button data-tab="stu"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 010 7M18 14.5c1.8.7 3 2.6 3.5 5.5"/></svg>학생</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>휴일·설정</button>
</nav>
<div id="sheetRoot"></div>
<input type="file" id="bkFile" accept=".json,application/json" hidden>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// ---------- Korean public holidays (official list; 학원 can override in 휴일 탭) ----------
const BUILTIN = {

const STATUS = {present:["출석","ok"],leave:["하원","out"],absent:["결석","no"],late:["지각","late"]}; // 지각은 예전 기록 표시용

const hm = iso => { if (!iso) return ""; const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

// ---------- date helpers (YYYY-MM-DD strings, local time) ----------
const pad = n => String(n).padStart(2,"0");
const toD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d,12); };
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays = (s,n) => { const d = toD(s); d.setDate(d.getDate()+n); return fmt(d); };
const dow = s => toD(s).getDay();
const today = () => fmt(new Date());
const md = s => { const d = toD(s); return `${d.getMonth()+1}/${d.getDate()}`; };
const mdw = s => `${md(s)}(${WD[dow(s)]})`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const attKey = (sid,date,time) => `${sid}_${date}_${String(time).replace(":","")}`;

function setSync(){

  el.querySelector("span").textContent = mode === "db" ? (online ? "모든 기기 동기화" : "오프라인 · 연결되면 자동 저장") : mode === "signin" ? "로그인 필요" : mode === "noconfig" ? "설정 필요" : "불러오는 중";

let unsubs = [], LINKS = {};
function listen(){
  unsubs.forEach(u => u()); unsubs = [];
  for (const coll of Object.keys(S)) {
    unsubs.push(ref(coll).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S[coll] = m; render();
    }, () => toast("동기화가 잠시 끊겼어요.")));
  }
  // 학부모 알림 링크는 users/ 밖(links/)에 있어서 따로 받아요.
  unsubs.push(fs.collection("links").where("uid", "==", me.uid).onSnapshot(snap => {
    LINKS = {}; snap.docs.forEach(d => { LINKS[d.id] = d.data(); }); render();
  }, () => {}));
}
async function boot(){
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || !window.firebase) { mode = "noconfig"; setSync(); render(); return; }
  firebase.initializeApp(cfg);
  auth = firebase.auth(); fs = firebase.firestore();
  try { await fs.enablePersistence({synchronizeTabs:true}); } catch(e){}
  auth.onAuthStateChanged(u => {
    me = u;
    if (u) { mode = "db"; for (const k in S) S[k] = {}; listen(); }
    else { mode = "signin"; unsubs.forEach(f => f()); unsubs = []; for (const k in S) S[k] = {}; }
    setSync(); render();
  });
}

// ---------- schedule engine ----------
function holidayName(date){
  const c = S.hol[date];
  if (c) return c.off === false ? null : (c.name || "학원 휴일");
  return BUILTIN[date] || null;
}
function eventsOf(sid){ return Object.entries(S.events).filter(([,e]) => e.sid === sid).map(([id,e]) => ({id,...e})); }
// All sessions (incl. skipped ones) of one student between from..to inclusive.
function sessionsOf(s, sid, from, to){
  const out = [], evs = eventsOf(sid);
  const start = s.start || "2000-01-01";
  const lo = from < start ? start : from;
  for (let d = lo; d <= to; d = addDays(d,1)) {
    const w = dow(d);
    for (const sl of (s.slots || [])) {
      if (Number(sl.d) !== w) continue;
      const hol = holidayName(d);
      const ch = evs.find(e => (e.type === "cancel" || e.type === "move") && e.date === d && e.time === sl.t);
      if (hol) out.push({date:d,time:sl.t,kind:"holiday",skip:true,note:hol});
      else if (ch && ch.type === "cancel") out.push({date:d,time:sl.t,kind:"cancel",skip:true,ev:ch,note:ch.note||"빠짐"});
      else if (ch) out.push({date:d,time:sl.t,kind:"movedout",skip:true,ev:ch,note:`${mdw(ch.toDate)} ${ch.toTime}로 옮김`});
      else out.push({date:d,time:sl.t,kind:"regular"});
    }
  }
  for (const e of evs) {
    if (e.type === "makeup" && e.date >= lo && e.date <= to) out.push({date:e.date,time:e.time,kind:"makeup",ev:e,note:e.note||""});
    if (e.type === "move" && e.toDate >= lo && e.toDate <= to) out.push({date:e.toDate,time:e.toTime,kind:"movedin",ev:e,note:`${mdw(e.date)} 수업 변경`});
  }
  out.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  return out;
}
// 이번 회차: from start, the first `count` real sessions get numbers 1..count.
const cycleCache = new Map();
function cycleOf(sid){
  const s = S.students[sid]; if (!s) return null;
  const key = sid + JSON.stringify([s, eventsOf(sid), S.hol]);
  if (cycleCache.has(key)) return cycleCache.get(key);
  const count = Number(s.count) || 0;
  let res = null;
  if (count > 0 && s.start) {
    const span = Math.max(60, Math.ceil(count / Math.max(1,(s.slots||[]).length)) * 7 * 2 + 60);
    const all = sessionsOf(s, sid, s.start, addDays(s.start, span));
    const list = []; let n = 0;
    for (const x of all) {
      if (x.skip) { if (n < count) list.push(x); continue; }
      if (n >= count) break;
      n++; list.push({...x, n});
    }
    const real = list.filter(x => !x.skip);
    const done = real.filter(x => S.att[attKey(sid,x.date,x.time)]).length;
    res = {count, list, real, done, end: real.length ? real[real.length-1].date : null, nums: new Map(real.map(x => [x.date+"_"+x.time, x.n]))};
  }
  cycleCache.set(key, res);
  if (cycleCache.size > 400) cycleCache.clear();
  return res;
}
function sessionsOnDay(date){
  const out = [];
  for (const [sid,s] of Object.entries(S.students)) {
    if (s.active === false) continue;
    for (const x of sessionsOf(s, sid, date, date)) out.push({...x, sid, s});
  }
  out.sort((a,b) => (a.skip - b.skip) || a.time.localeCompare(b.time) || a.s.name.localeCompare(b.s.name));
  return out;
}
const allGroups = () => [...new Set([...Object.values(S.groups).map(g => g.name), ...Object.values(S.students).map(s => s.group)].filter(Boolean))].sort((a,b) => a.localeCompare(b));
const groupId = name => Object.keys(S.groups).find(id => S.groups[id].name === name);
const slotText = s => (s.slots||[]).slice().sort((a,b)=>((a.d+6)%7)-((b.d+6)%7)||a.t.localeCompare(b.t)).map(x => `${WD[x.d]} ${x.t}`).join(" · ") || "요일 미정";
const colorOf = s => `var(--c${(Number(s.color)||0)%8})`;

// ---- 출석 (day) ----
function viewDay(){
  const d = ui.date, w = dow(d), hol = holidayName(d);
  const list = sessionsOnDay(d);
  const real = list.filter(x => !x.skip);
  const cnt = {present:0,leave:0,absent:0};
  real.forEach(x => { const a = S.att[attKey(x.sid,x.date,x.time)]; if (a) { cnt[a.status === "absent" ? "absent" : "present"]++; if (a.status === "leave") cnt.leave++; } });
  const left = real.length - cnt.present - cnt.absent;
  let h = `<div class="datebar"><button class="btn icon" data-act="day" data-n="-1" aria-label="이전 날">‹</button>
    <h2 class="wd-${w}">${md(d)} ${WD[w]}요일${d === today() ? "<small>오늘</small>" : ""}</h2>
    <button class="btn icon" data-act="day" data-n="1" aria-label="다음 날">›</button><span class="spacer"></span>
    ${d !== today() ? `<button class="btn ghost" data-act="today">오늘로</button>` : ""}
    <input class="in" type="date" id="pickDay" value="${d}" style="width:auto;min-height:40px;font-size:14px"></div>`;
  if (hol) h += `<div class="banner hol">● ${esc(hol)} · 정규 수업은 쉬어요. 이 날 수업하려면 휴일 탭에서 바꿀 수 있어요.</div>`;
  if (!Object.keys(S.students).length) return h + noStudents();
  if (real.length) h += `<div class="summary"><span class="pill">수업 ${real.length}</span><span class="pill ok">출석 ${cnt.present}</span><span class="pill out">하원 ${cnt.leave}</span><span class="pill no">결석 ${cnt.absent}</span>${left ? `<span class="pill">미체크 ${left}</span>` : ""}</div>`;
  if (!list.length) h += `<div class="empty"><b>이 날은 수업이 없어요</b>보강이 필요하면 아래 버튼으로 추가하세요.</div>`;
  h += `<div class="cards">` + list.map(cardHTML).join("") + `</div>`;
  h += `<div class="row" style="margin-top:14px"><button class="btn" data-act="makeup" data-date="${d}">＋ 이 날 보강 추가</button><button class="btn ghost" data-act="showMakeups">보강 모아보기</button></div>`;
  return h;
}
function cardHTML(x){
  const cyc = cycleOf(x.sid);
  const n = cyc?.nums.get(x.date+"_"+x.time);
  const tag = x.kind === "makeup" ? `<span class="pill mk">보강</span>` : x.kind === "movedin" ? `<span class="pill mk">변경</span>` : x.kind === "holiday" ? `<span class="pill hol">휴일</span>` : x.skip ? `<span class="pill">빠짐</span>` : "";
  const sub = [esc(x.s.group || ""), n ? `${n}/${cyc.count}회` : "", x.note && !x.skip ? esc(x.note) : ""].filter(Boolean).join(" · ");
  if (x.skip) return `<div class="card off"><div class="chead"><span class="time">${x.time}</span><span class="dot" style="background:${colorOf(x.s)}"></span><div class="who"><b>${esc(x.s.name)}</b><span>${esc(x.note)}</span></div>${tag}
    ${x.kind !== "holiday" ? `<button class="btn ghost" data-act="undoEv" data-id="${x.ev.id}">되돌리기</button>` : ""}</div></div>`;
  const a = S.att[attKey(x.sid,x.date,x.time)];
  const k = attKey(x.sid,x.date,x.time);
  return `<div class="card"><div class="chead"><span class="time">${x.time}</span><span class="dot" style="background:${colorOf(x.s)}"></span>
    <div class="who"><b>${esc(x.s.name)}</b><span>${sub || "&nbsp;"}</span></div>${tag}
    <button class="btn ghost" data-act="change" data-sid="${x.sid}" data-date="${x.date}" data-time="${x.time}" data-kind="${x.kind}" data-ev="${x.ev?.id||""}">일정</button></div>
    <div class="seg">${MARKS.map(st => { const [lab,cls] = STATUS[st];
      const on = st === "present" ? ["present","late","leave"].includes(a?.status) : a?.status === st;
      const tm = on && st === "present" ? hm(a.inAt || a.at) : on && st === "leave" ? hm(a.outAt) : "";
      return `<button class="${cls}${on ? " on" : ""}" data-act="mark" data-k="${k}" data-sid="${x.sid}" data-date="${x.date}" data-time="${x.time}" data-st="${st}" aria-pressed="${on}">${lab}${tm ? `<small>${tm}</small>` : ""}</button>`; }).join("")}</div></div>`;
}

// ---- 달력 (month) ----
function calSessions(from, to){
  const match = (sid,s) => ui.filter === "all" || ui.filter === "s:"+sid || ui.filter === "g:"+(s.group||"");
  const byDay = {};
  for (const [sid,s] of Object.entries(S.students)) {
    if (s.active === false || !match(sid,s)) continue;
    for (const x of sessionsOf(s, sid, from, to)) if (!x.skip) (byDay[x.date] ||= []).push({...x, sid, s});
  }
  for (const k in byDay) byDay[k].sort((a,b) => a.time.localeCompare(b.time) || a.s.name.localeCompare(b.s.name));
  return byDay;
}
function calHead(title, act, prevLabel, nextLabel, resetBtn){

    ${modeToggle()}</div>`;
}
const modeToggle = () => `<div class="mode" role="group" aria-label="달력 보기">${[["month","월간"],["week","주간"],["makeup","보강"],["notice","공지"]].map(([m,l]) => `<button data-act="calMode" data-m="${m}" aria-pressed="${ui.calMode===m}">${l}</button>`).join("")}</div>`;
function calFilters(){
  const groups = [...new Set(Object.values(S.students).map(s => s.group).filter(Boolean))].sort();
  let h = "";

    <label class="row" style="font-size:14px"><input type="checkbox" id="cPush"${cfg().push !== false ? " checked" : ""}> 알림 앱을 설치한 부모님께 자동으로 푸시 알림 보내기</label>
    <label class="row" style="font-size:14px"><input type="checkbox" id="cNotify"${cfg().notify ? " checked" : ""}> 출석·하원 누르면 알림 보내기 창 띄우기</label>
    <div><button class="btn primary" data-act="saveCfg">알림 설정 저장</button></div></div>
  <div class="sec"><h3>학생 출석 화면 (키오스크)</h3><div class="hint">학원 입구 태블릿에 띄워 두면 학생이 출석 번호 4자리를 누르고 출석·하원을 직접 찍어요. 선생님 출석부에 바로 반영되고, 알림 앱을 설치한 부모님께 알림이 가요. 출석 번호는 학생 정보에서 정하고, 비워 두면 부모님 휴대폰 번호 뒤 4자리를 써요.</div>
    <label class="f">화면 잠금 번호 (키오스크를 끌 때 필요해요)<input class="in" id="kLock" type="password" inputmode="numeric" maxlength="8" value="${esc(cfg().kioskLock || "")}" placeholder="숫자 4~8자리"></label>
    <div><button class="btn primary" data-act="kioskStart">이 기기에서 학생 출석 화면 켜기</button></div></div>
  <div class="sec"><h3>백업</h3><div class="hint">출석부 전체를 파일로 저장하거나, 저장해 둔 파일(또는 예전 출석부에서 옮겨 온 파일)을 불러올 수 있어요. 불러오면 같은 학생·기록은 파일 내용으로 바뀌고, 나머지는 그대로 남아요.</div>
    <div class="row"><button class="btn" data-act="exportBk">백업 파일 저장</button><button class="btn" data-act="importBk">백업 불러오기</button></div><div id="bkMsg"></div></div>
  <div class="sec"><h3>계정</h3><div class="hint">${esc(me?.email || "")} 계정으로 로그인했어요. 같은 계정으로 로그인한 기기끼리 출석부가 동기화돼요.</div><div><button class="btn" data-act="logout">로그아웃</button></div></div>
`;
  return h;
}

// ---------- sheets ----------
let sheetClose = null;
function openSheet(html, onMount){
  const root = document.getElementById("sheetRoot");
  root.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const scrim = document.getElementById("scrim");
  scrim.addEventListener("click", e => { if (e.target === scrim) closeSheet(); });
  sheetClose = closeSheet;
  onMount && onMount(scrim.querySelector(".sheet"));
}
function closeSheet(){ document.getElementById("sheetRoot").innerHTML = ""; }
function studentOptions(sel){
  return Object.entries(S.students).filter(([,s]) => s.active !== false).sort((a,b)=>a[1].name.localeCompare(b[1].name))
    .map(([id,s]) => `<option value="${id}"${id===sel?" selected":""}>${esc(s.name)}${s.group ? " ("+esc(s.group)+")" : ""}</option>`).join("");
}

function groupSheet(){
  const draw = el => {
    const counts = {}; Object.values(S.students).forEach(s => { if (s.group) counts[s.group] = (counts[s.group]||0) + 1; });
    const gs = allGroups();
    el.querySelector("#gList").innerHTML = gs.length ? gs.map((g,i) => `<div class="hrow" style="flex-wrap:wrap"><input class="in" data-gname="${i}" value="${esc(g)}" maxlength="30" style="flex:1;min-width:140px"><span class="pill">${counts[g]||0}명</span><button class="btn" data-gsave="${i}">이름 저장</button><button class="btn danger" data-gdel="${i}">삭제</button></div>`).join("") : `<div class="hint">아직 만든 반이 없어요.</div>`;
    el._gs = gs;
  };
  openSheet(`<div class="row"><h3>반 관리</h3><span class="spacer"></span><button class="btn ghost" data-close>닫기</button></div>
    <div class="row"><input class="in" id="gNew" placeholder="새 반 이름 (예: 초등 3반)" maxlength="30" style="flex:1;min-width:160px"><button class="btn primary" data-gadd>반 만들기</button></div>
    <div class="hlist" id="gList"></div><div id="gMsg"></div>
    <div class="hint">반을 지우면 그 반 학생들은 "반 미정"으로 옮겨지고, 학생과 출석 기록은 그대로 남아요.</div>`, el => {
    draw(el);
    el.addEventListener("click", ev => {
      const t = ev.target.closest("button"); if (!t) return;
      const renameStudents = (from, to) => Object.entries(S.students).filter(([,s]) => s.group === from).forEach(([id,s]) => put("students", id, {...s, group:to}));
      if (t.hasAttribute("data-close")) return closeSheet();
      if (t.hasAttribute("data-gadd")) {
        const n = el.querySelector("#gNew").value.trim();
        if (!n) { el.querySelector("#gNew").focus(); return toast("반 이름을 입력해 주세요."); }
        if (allGroups().includes(n)) return toast("이미 있는 반이에요.");
        put("groups", uid(), {name:n}); el.querySelector("#gNew").value = ""; draw(el); toast(`${n}을(를) 만들었어요.`);
      }
      if (t.dataset.gsave != null) {
        const old = el._gs[Number(t.dataset.gsave)], n = el.querySelector(`[data-gname="${t.dataset.gsave}"]`).value.trim();
        if (!n || n === old) return;
        if (allGroups().includes(n)) return toast("이미 있는 반 이름이에요.");
        const gid = groupId(old); if (gid) put("groups", gid, {name:n}); else put("groups", uid(), {name:n});
        renameStudents(old, n); if (ui.filter === "g:"+old) ui.filter = "g:"+n; draw(el); toast("반 이름을 바꿨어요.");
      }
      if (t.dataset.gdel != null) {
        const g = el._gs[Number(t.dataset.gdel)];
        el.querySelector("#gMsg").innerHTML = `<div class="confirm">${esc(g)}을(를) 지울까요? 학생은 지워지지 않고 "반 미정"으로 옮겨져요.<div class="row"><button class="btn danger" data-gdelok="${esc(g)}">반 삭제</button><button class="btn" data-gdelno>취소</button></div></div>`;
      }
      if (t.hasAttribute("data-gdelno")) el.querySelector("#gMsg").innerHTML = "";
      if (t.dataset.gdelok != null) {
        const g = t.dataset.gdelok, gid = groupId(g);
        if (gid) del("groups", gid); renameStudents(g, ""); if (ui.filter === "g:"+g) ui.filter = "all";
        el.querySelector("#gMsg").innerHTML = ""; draw(el); toast("반을 삭제했어요.");
      }
    });
  });
}

function studentForm(sid, g0){
  const s = sid ? S.students[sid] : {name:"",group:g0||"",slots:[{d:1,t:"16:00"}],start:today(),count:8,color:Object.keys(S.students).length%8,memo:"",parents:[]};
  const parentsHTML = ps => ps.map((p,i) => `<div class="prow"><input class="in" data-p-rel="${i}" value="${esc(p.rel)}" placeholder="엄마" maxlength="10"><input class="in" type="tel" data-p-tel="${i}" value="${esc(p.tel)}" placeholder="010-1234-5678" inputmode="tel" maxlength="20"><button class="btn icon" data-prm="${i}" aria-label="삭제">×</button></div>`).join("");
  const c = sid ? cycleOf(sid) : null;
  const slotsHTML = sl => sl.map((x,i) => `<div class="slot"><select class="in" data-slot-d="${i}">${WD.map((w,j)=>`<option value="${j}"${Number(x.d)===j?" selected":""}>${w}요일</option>`).join("")}</select><input class="in" type="time" data-slot-t="${i}" value="${x.t}" step="300"><button class="btn icon" data-rm="${i}" aria-label="삭제">×</button></div>`).join("");
  let h = `<div class="row"><h3>${sid ? esc(s.name) : "학생 추가"}</h3><span class="spacer"></span><button class="btn ghost" data-close>닫기</button></div>`;
  if (c) {
    h += `<div class="sec" style="margin:0"><div class="row"><h3 style="font-size:15px">이번 회차 ${c.count}회 일정</h3><span class="spacer"></span><span class="pill ok">${c.done}회 체크</span></div><div class="sched">`;
    h += c.list.map(x => {
      if (x.skip) return `<div class="sch skip"><span class="n">–</span><span>${mdw(x.date)} ${x.time}</span><span class="hint">${esc(x.note)}</span></div>`;
      const a = S.att[attKey(sid,x.date,x.time)];
      const tag = a ? `<span class="pill ${STATUS[a.status][1]}">${STATUS[a.status][0]}</span>` : (x.kind==="makeup"||x.kind==="movedin") ? `<span class="pill mk">${x.kind==="makeup"?"보강":"변경"}</span>` : "";
      return `<button class="sch" data-goto="${x.date}"><span class="n">${x.n}회</span><span>${mdw(x.date)} ${x.time}</span>${tag}</button>`;
    }).join("");
    if (c.real.length < c.count) h += `<div class="hint">요일을 넣으면 나머지 회차가 채워져요.</div>`;
    h += `</div><div class="row"><button class="btn" data-mk>＋ 보강 추가</button>${c.end ? `<button class="btn" data-next>다음 ${c.count}회 시작 (${mdw(addDays(c.end,1))}부터)</button>` : ""}</div></div>`;
  }
  h += `<label class="f">이름<input class="in" id="fName" value="${esc(s.name)}" placeholder="예: 김민지" maxlength="30"></label>
    <label class="f">학생 출석 번호 (4자리)<input class="in" id="fPin" value="${esc(s.pin||"")}" placeholder="${s.parents?.[0]?.tel ? "비우면 부모님 번호 뒤 4자리(" + esc(lastFour(s.parents[0].tel)) + ")" : "예: 1234"}" inputmode="numeric" maxlength="4" pattern="[0-9]*"></label>
    <label class="f">반<select class="in" id="fGroup"><option value="">반 없음</option>${allGroups().map(g => `<option value="${esc(g)}"${g === s.group ? " selected" : ""}>${esc(g)}</option>`).join("")}<option value="__new">＋ 새 반 만들기</option></select></label>
    <label class="f" id="fNewWrap" hidden>새 반 이름<input class="in" id="fNewGroup" placeholder="예: 초등 3반" maxlength="30"></label>
    <div class="f" style="display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500">매주 수업 요일·시간<div id="slots" style="display:grid;gap:6px">${slotsHTML(s.slots||[])}</div><div><button class="btn" data-addslot>＋ 요일 추가</button></div></div>
    <div class="two"><label class="f">회차 시작일<input class="in" type="date" id="fStart" value="${s.start||today()}"></label>
    <label class="f">한 회차 수업 횟수<input class="in" type="number" id="fCount" min="0" max="60" value="${Number(s.count)||0}" inputmode="numeric"></label></div>
    <div class="hint">횟수를 0으로 두면 끝 없이 매주 반복돼요. 공휴일·학원 휴일·빠진 수업은 회차에서 빠지고 뒤로 밀려요.</div>
    <div class="f" style="display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:500">부모님 연락처 (출석·하원 알림 받을 사람)<div id="parents" style="display:grid;gap:6px">${parentsHTML(s.parents||[])}</div><div><button class="btn" data-addp>＋ 연락처 추가</button></div></div>
    ${sid ? linkHTML(sid) : ""}
    <label class="f">메모<textarea class="in" id="fMemo" rows="2" maxlength="300">${esc(s.memo||"")}</textarea></label>
    ${sid ? `<label class="row" style="font-size:14px"><input type="checkbox" id="fActive"${s.active===false?" checked":""}> 잠시 쉬는 중 (출석·달력에서 숨김)</label>` : ""}
    <div class="row"><button class="btn primary" data-save>저장</button>${sid ? `<span class="spacer"></span><button class="btn danger" data-del>학생 삭제</button>` : ""}</div><div id="delZone"></div>`;
  openSheet(h, el => {
    el.querySelector("#fGroup").addEventListener("change", e => { const nw = e.target.value === "__new"; el.querySelector("#fNewWrap").hidden = !nw; if (nw) el.querySelector("#fNewGroup").focus(); });
    let slots = (s.slots||[]).map(x => ({...x}));
    let parents = (s.parents||[]).map(x => ({...x}));
    const readParents = () => { parents = parents.map((x,i) => ({rel:el.querySelector(`[data-p-rel="${i}"]`).value.trim(), tel:el.querySelector(`[data-p-tel="${i}"]`).value.trim()})); };
    const readSlots = () => { slots = slots.map((x,i) => ({d:Number(el.querySelector(`[data-slot-d="${i}"]`).value), t:el.querySelector(`[data-slot-t="${i}"]`).value || "16:00"})); };
    el.addEventListener("click", ev => {
      const t = ev.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-close")) closeSheet();
      else if (t.hasAttribute("data-addslot")) { readSlots(); slots.push({d:slots.length ? (slots[slots.length-1].d % 6) + 1 : 1, t: slots.length ? slots[slots.length-1].t : "16:00"}); el.querySelector("#slots").innerHTML = slotsHTML(slots); }
      else if (t.hasAttribute("data-addp")) { readParents(); parents.push({rel:parents.length ? "" : "엄마", tel:""}); el.querySelector("#parents").innerHTML = parentsHTML(parents); el.querySelector(`[data-p-tel="${parents.length-1}"]`).focus(); }
      else if (t.dataset.prm != null) { readParents(); parents.splice(Number(t.dataset.prm),1); el.querySelector("#parents").innerHTML = parentsHTML(parents); }
      else if (t.dataset.link) linkAction(t.dataset.link, sid, el);
      else if (t.dataset.rm != null) { readSlots(); slots.splice(Number(t.dataset.rm),1); el.querySelector("#slots").innerHTML = slotsHTML(slots); }
      else if (t.dataset.goto) { ui.date = t.dataset.goto; if (!isSplit()) ui.tab = "day"; closeSheet(); render(); }
      else if (t.hasAttribute("data-mk")) { closeSheet(); makeupSheet(today(), sid); }
      else if (t.hasAttribute("data-next")) { put("students", sid, {...S.students[sid], start:addDays(c.end,1)}); toast("다음 회차를 시작했어요."); closeSheet(); }
      else if (t.hasAttribute("data-save")) {
        readSlots(); readParents();
        const name = el.querySelector("#fName").value.trim();
        const pin = el.querySelector("#fPin").value.replace(/\D/g, "");
        if (pin && pin.length !== 4) { el.querySelector("#fPin").focus(); toast("출석 번호는 숫자 4자리로 넣어 주세요."); return; }
        if (!name) { el.querySelector("#fName").focus(); toast("이름을 입력해 주세요."); return; }
        let group = el.querySelector("#fGroup").value;
        if (group === "__new") {
          group = el.querySelector("#fNewGroup").value.trim();
          if (!group) { el.querySelector("#fNewGroup").focus(); toast("새 반 이름을 입력해 주세요."); return; }
          if (!groupId(group)) put("groups", uid(), {name:group});
        }
        const data = {...(sid ? S.students[sid] : {}), name, group, slots, start:el.querySelector("#fStart").value || today(),
          count:Math.max(0, Math.min(60, Number(el.querySelector("#fCount").value) || 0)), memo:el.querySelector("#fMemo").value.trim(), color:s.color ?? 0, parents:parents.filter(p => p.tel), pin,
          active: el.querySelector("#fActive") ? !el.querySelector("#fActive").checked : true};
        const id = sid || uid(); put("students", id, data); if (data.linkCode) syncLink(data.linkCode); toast("저장했어요."); closeSheet();
      }
      else if (t.hasAttribute("data-del")) {
        el.querySelector("#delZone").innerHTML = `<div class="confirm">${esc(s.name)} 학생과 출석 기록, 보강 일정을 모두 지울까요? 되돌릴 수 없어요.<div class="row"><button class="btn danger" data-delok>모두 삭제</button><button class="btn" data-delno>취소</button></div></div>`;
      }
      else if (t.hasAttribute("data-delno")) el.querySelector("#delZone").innerHTML = "";
      else if (t.hasAttribute("data-delok")) {
        if (s.linkCode) unlink(sid);
        Object.entries(S.events).filter(([,e]) => e.sid === sid).forEach(([id]) => del("events", id));
        Object.entries(S.att).filter(([,a]) => a.sid === sid).forEach(([id]) => del("att", id));
        del("students", sid); toast("삭제했어요."); closeSheet();
      }
    });
  });
}

function makeupSheet(date, sid){
  if (!Object.keys(S.students).length) { toast("먼저 학생을 추가해 주세요."); return; }
  const s0 = sid && S.students[sid];
  openSheet(`<div class="row"><h3>보강 추가</h3><span class="spacer"></span><button class="btn ghost" data-close>닫기</button></div>
    <label class="f">학생<select class="in" id="mSid">${studentOptions(sid)}</select></label>
    <div class="two"><label class="f">날짜<input class="in" type="date" id="mDate" value="${date}"></label><label class="f">시간<input class="in" type="time" id="mTime" value="${s0?.slots?.[0]?.t || "16:00"}" step="300"></label></div>
    <label class="f">메모 (선택)<input class="in" id="mNote" placeholder="예: 10/3 결석 보강" maxlength="40"></label>
    <div class="hint">보강도 한 회차로 세요. 빠진 수업을 다른 날로 옮기는 거라면 그 수업의 "일정" 버튼에서 "다른 날로 옮기기"를 쓰면 회차가 그대로 유지돼요.</div>
    <div><button class="btn primary" data-ok>보강 추가</button></div>`, el => {
    el.addEventListener("click", ev => {
      const t = ev.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-close")) closeSheet();
      if (t.hasAttribute("data-ok")) {
        const d = el.querySelector("#mDate").value, tm = el.querySelector("#mTime").value;
        if (!d || !tm) { toast("날짜와 시간을 입력해 주세요."); return; }
        put("events", uid(), {sid:el.querySelector("#mSid").value, type:"makeup", date:d, time:tm, note:el.querySelector("#mNote").value.trim()});
        toast(`${mdw(d)} ${tm} 보강을 추가했어요.`); closeSheet();
      }
    });
  });
}

function changeSheet(sid, date, time, kind, evId){
  const s = S.students[sid];
  const isExtra = kind === "makeup" || kind === "movedin";
  openSheet(`<div class="row"><h3>${esc(s.name)} · ${mdw(date)} ${time}</h3><span class="spacer"></span><button class="btn ghost" data-close>닫기</button></div>
    ${isExtra ? `<div class="hint">${kind === "makeup" ? "보강 수업이에요." : "다른 날에서 옮겨 온 수업이에요."}</div>` : ""}
    <div class="sec" style="margin:0"><h3>다른 날로 옮기기</h3><div class="hint">학생 사정으로 날짜가 바뀌면 여기서 옮기세요. 회차 수는 그대로예요.</div>
      <div class="two"><label class="f">새 날짜<input class="in" type="date" id="cDate" value="${addDays(date,1)}"></label><label class="f">새 시간<input class="in" type="time" id="cTime" value="${time}" step="300"></label></div>
      <div><button class="btn primary" data-move>옮기기</button></div></div>
    ${isExtra ? `<div><button class="btn danger" data-rmEv>${kind === "makeup" ? "이 보강 삭제" : "원래 날짜로 되돌리기"}</button></div>`
      : `<div class="sec" style="margin:0"><h3>이번 수업 빠짐</h3><div class="hint">출석 체크 없이 이번 수업을 빼요. 회차가 하나 뒤로 밀려요. 그냥 결석으로 셀 거라면 "결석"을 누르세요.</div>
      <label class="f">사유 (선택)<input class="in" id="cNote" placeholder="예: 가족 여행" maxlength="40"></label><div><button class="btn" data-cancel>빠짐 처리</button></div></div>`}`, el => {
    el.addEventListener("click", ev => {
      const t = ev.target.closest("button"); if (!t) return;
      if (t.hasAttribute("data-close")) return closeSheet();
      const ex = evId && S.events[evId];
      if (t.hasAttribute("data-move")) {
        const nd = el.querySelector("#cDate").value, nt = el.querySelector("#cTime").value;
        if (!nd || !nt) return toast("새 날짜와 시간을 입력해 주세요.");
        const old = S.att[attKey(sid,date,time)];
        if (kind === "makeup") put("events", evId, {...ex, date:nd, time:nt});
        else if (kind === "movedin") put("events", evId, {...ex, toDate:nd, toTime:nt});
        else put("events", uid(), {sid, type:"move", date, time, toDate:nd, toTime:nt});
        if (old) del("att", attKey(sid,date,time));

const lastFour = t => String(t || "").replace(/\D/g, "").slice(-4);
const pinOf = s => s.pin || (s.parents || []).map(p => lastFour(p.tel)).find(x => x.length === 4) || "";
const kiosk = { on: (() => { try { return localStorage.getItem("kiosk") === "1"; } catch(e){ return false; } })(), pin: "", view: "pad", msg: "", err: false, timer: null, who: [] };
function kioskReset(ms){ clearTimeout(kiosk.timer); kiosk.timer = setTimeout(() => { kiosk.view = "pad"; kiosk.pin = ""; kiosk.msg = ""; kiosk.err = false; renderKiosk(); }, ms); }
// Today's sessions for this pin; one row per student name (the same child can be in two classes).
function kioskMatches(pin){
  const t = today(), now = new Date(), nowHM = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const rows = sessionsOnDay(t).filter(x => !x.skip && pinOf(x.s) === pin);
  const byName = {};
  for (const x of rows) (byName[x.s.name] ||= []).push(x);
  return Object.entries(byName).map(([name, list]) => {
    const att = x => S.att[attKey(x.sid, x.date, x.time)];
    const near = (a, b) => Math.abs(hmMin(a.time) - hmMin(nowHM)) - Math.abs(hmMin(b.time) - hmMin(nowHM));
    const inS = list.filter(x => !att(x) || att(x).status === "absent").sort(near)[0];
    const outS = list.filter(x => ["present","late"].includes(att(x)?.status)).pop();
    const last = list.map(att).filter(Boolean).pop();
    return {name, inS, outS, last};
  });
}
const hmMin = t => { const [h,m] = t.split(":").map(Number); return h * 60 + m; };
function renderKiosk(){

const kioskPad = ok => `<div class="kpad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join("")}<button data-k="del" aria-label="지우기">⌫</button><button data-n="0">0</button>${ok ? `<button data-k="ok" style="font-size:20px">${ok}</button>` : `<button data-k="clr" style="font-size:18px">다시</button>`}</div>`;
function kioskMark(w, kind){
  const x = kind === "in" ? w.inS : w.outS; if (!x) return;
  const k = attKey(x.sid, x.date, x.time), cur = S.att[k], now = new Date().toISOString();

document.getElementById("kioskRoot").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const n = b.dataset.n, k = b.dataset.k;
  clearTimeout(kiosk.timer);
  if (n != null) {
    if (kiosk.view === "lock") { if (kiosk.pin.length < 8) kiosk.pin += n; kiosk.msg = ""; kiosk.err = false; return renderKiosk(); }
    if (kiosk.pin.length >= 4) return;
    kiosk.pin += n; kiosk.msg = ""; kiosk.err = false;
    if (kiosk.pin.length === 4) {
      const who = kioskMatches(kiosk.pin);
      if (!who.length) {
        const known = Object.values(S.students).some(s => s.active !== false && pinOf(s) === kiosk.pin);
        kiosk.msg = known ? "오늘은 수업이 없는 날이에요. 선생님께 말씀해 주세요." : "번호를 다시 확인해 주세요."; kiosk.err = true; kiosk.pin = "";
      } else { kiosk.who = who; kiosk.view = "who"; kioskReset(20000); }

    return renderKiosk();

  if (k === "del") kiosk.pin = kiosk.pin.slice(0, -1);
  else if (k === "clr") { kiosk.pin = ""; kiosk.msg = ""; kiosk.err = false; }
  else if (k === "back") { kiosk.view = "pad"; kiosk.pin = ""; kiosk.msg = ""; kiosk.err = false; }
  else if (k === "lock") { kiosk.view = "lock"; kiosk.pin = ""; kiosk.msg = ""; kioskReset(30000); }
  else if (k === "ok") {
    if (kiosk.pin && kiosk.pin === cfg().kioskLock) {
      kiosk.on = false; kiosk.view = "pad"; kiosk.pin = ""; try { localStorage.removeItem("kiosk"); } catch(e){}
      document.fullscreenElement && document.exitFullscreen?.().catch(() => {});
      return render();
    }
    kiosk.pin = ""; kiosk.msg = "잠금 번호가 맞지 않아요."; kiosk.err = true;
  }
  else if (k === "in" || k === "out") return kioskMark(kiosk.who[Number(b.dataset.i)], k);
  renderKiosk();
});

    if (act === "sms") { const ps = (s.parents || []).filter(p => p.tel); location.href = smsHref(ps.map(p => p.tel), text); return; }
    if (act === "share" && navigator.share) { try { await navigator.share({text}); } catch(e){} return; }
    try { await navigator.clipboard.writeText(act === "copy" ? url : text); toast("복사했어요."); } catch(e){ toast("복사하지 못했어요. 링크 칸을 길게 눌러 복사해 주세요."); }
    return;
  }
  closeSheet(); setTimeout(() => studentForm(sid), 50);
}
// ---------- 부모님 알림: 문자 앱이나 카톡으로 보낼 내용을 준비해요 ----------
const CFG0 = {academy:"", inMsg:"[{학원}] {이름} 학생이 {시간}에 학원에 도착했어요.", outMsg:"[{학원}] {이름} 학생이 {시간}에 수업을 마치고 하원했어요.", notify:true};
const cfg = () => ({...CFG0, ...(S.cfg.main || {})});
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function smsHref(tels, body){
  const nums = tels.map(t => t.replace(/[^0-9+]/g, "")).filter(Boolean), b = encodeURIComponent(body);
  return isIOS ? (nums.length > 1 ? `sms:/open?addresses=${nums.join(",")}&body=${b}` : `sms:${nums[0] || ""}&body=${b}`) : `sms:${nums.join(",")}?body=${b}`;
}
function notifySheet(sid, kind, iso){
  const s = S.students[sid], c = cfg();
  if (!s) return;
  if (c.push !== false && s.linkCode && LINKS[s.linkCode]?.joined) return toast("부모님 앱으로 알림이 가요.");
  if (!c.notify) return;
  const ps = (s.parents || []).filter(p => p.tel);
  if (!ps.length) return toast(`${s.name} 학생은 부모님 연락처가 없어요. 학생 정보에서 넣을 수 있어요.`);
  const fill = t => (c.academy ? t : t.replaceAll("[{학원}] ", "")).replaceAll("{이름}", s.name).replaceAll("{시간}", hm(iso)).replaceAll("{학원}", c.academy);
  const body = fill(kind === "in" ? c.inMsg : c.outMsg);
  openSheet(`<div class="row"><h3>${esc(s.name)} ${kind === "in" ? "출석" : "하원"} 알림</h3><span class="spacer"></span><button class="btn ghost" data-close>닫기</button></div>
    <div class="hint">받는 사람: ${ps.map(p => esc((p.rel ? p.rel + " " : "") + p.tel)).join(", ")}</div>
    <textarea class="in" id="nBody" rows="3" maxlength="300">${esc(body)}</textarea>
    <div class="row"><button class="btn primary" data-sms>문자 보내기</button><button class="btn" data-share>카카오톡 등으로 보내기</button></div>
    <div class="hint">문자 앱이 받는 사람과 내용이 채워진 채로 열려요. 보내기만 누르면 돼요.</div>`, el => {
    el.addEventListener("click", async ev => {
      const t = ev.target.closest("button"); if (!t) return;
      const text = el.querySelector("#nBody").value;
      if (t.hasAttribute("data-close")) closeSheet();
      else if (t.hasAttribute("data-sms")) { location.href = smsHref(ps.map(p => p.tel), text); closeSheet(); }
      else if (t.hasAttribute("data-share")) {
        if (navigator.share) { try { await navigator.share({text}); closeSheet(); } catch(e){} }
        else { try { await navigator.clipboard.writeText(text); toast("내용을 복사했어요. 카카오톡에 붙여 넣어 주세요."); closeSheet(); } catch(e){ toast("이 기기에서는 공유를 쓸 수 없어요."); } }
      }
    });
  });
}
function exportBackup(){
  const data = {app:"academy-attendance", version:1, exportedAt:new Date().toISOString(), data:S};
  const blob = new Blob([JSON.stringify(data, null, 1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `출석부-백업-${today()}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  toast("백업 파일을 저장했어요.");
}
async function importBackup(file){
  let j; try { j = JSON.parse(await file.text()); } catch(e){ return toast("백업 파일을 읽지 못했어요. 출석부에서 저장한 .json 파일인지 확인해 주세요."); }
  const data = j && j.data;
  if (!data || typeof data !== "object") return toast("출석부 백업 파일이 아니에요.");
  const writes = [];
  for (const coll of Object.keys(S)) for (const [id, v] of Object.entries(data[coll] || {})) if (v && typeof v === "object") writes.push([coll, id, v]);
  if (!writes.length) return toast("파일에 불러올 내용이 없어요.");
  const msg = document.getElementById("bkMsg");
  try {
    for (let k = 0; k < writes.length; k += 400) {
      const b = fs.batch();
      writes.slice(k, k + 400).forEach(([c, id, v]) => b.set(ref(c).doc(id), v));
      await b.commit();
      if (msg) msg.innerHTML = `<div class="hint">${Math.min(k + 400, writes.length)} / ${writes.length} 불러오는 중…</div>`;
    }
    if (msg) msg.innerHTML = "";
    toast(`${writes.length}개 항목을 불러왔어요.`);
  } catch(e){ toast("불러오다 멈췄어요. 인터넷 연결을 확인하고 다시 해 주세요."); }
}
document.getElementById("bkFile").addEventListener("change", e => { const f = e.target.files[0]; if (f) importBackup(f); e.target.value = ""; });
let toastT;
function toast(msg){
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400);
}
// keep "today" correct if the app stays open past midnight
let lastToday = today();
setInterval(() => { if (today() !== lastToday) { if (ui.date === lastToday) ui.date = today(); lastToday = today(); render(); } }, 60000);
measureBars();
boot();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
